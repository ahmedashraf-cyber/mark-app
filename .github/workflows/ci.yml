name: CI

# Quality gates for pull requests: lint, type check (ratchet), tests, and a production build of the
# front end, plus the Rust unit tests. This workflow does NOT build or publish installers — that is
# build.yml, which only runs on pushes to main or by hand.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, type check, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (new errors fail; the baseline may only shrink)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npx vite build

  rust:
    name: Rust unit tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Build the front end (tauri::generate_context! needs ../dist)
        run: |
          npm ci
          npx vite build

      - name: Stand-in for the bundled ffmpeg resource (tauri-build checks that the file exists)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/ffmpeg.exe | Out-Null

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
