name: Build MARK Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install

      - name: Sync version to tauri.conf.json
        run: node scripts/sync-version.js
        shell: pwsh

      - name: Read version
        id: pkg
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Delete existing release for this version
        run: |
          $tag = "v${{ steps.pkg.outputs.VERSION }}"
          $repo = "${{ github.repository }}"
          $headers = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept = "application/vnd.github+json" }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -ErrorAction Stop
            $id = $release.id
            Write-Host "Deleting release id=$id tag=$tag"
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/$id" -Headers $headers | Out-Null
            git push origin --delete $tag 2>$null
          } catch {
            Write-Host "No existing release for $tag"
          }
        shell: pwsh

      - name: Bundle ffmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $exe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "src-tauri/binaries/ffmpeg.exe" -Force
          Write-Host "ffmpeg bundled: $((Get-Item 'src-tauri/binaries/ffmpeg.exe').Length) bytes"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARK_GOOGLE_CLIENT_SECRET: ${{ secrets.MARK_GOOGLE_CLIENT_SECRET }}
          MARK_FIREBASE_CLIENT_SECRET: ${{ secrets.MARK_FIREBASE_CLIENT_SECRET }}
          MARK_GMAIL_SENDER_REFRESH: ${{ secrets.MARK_GMAIL_SENDER_REFRESH }}
          MARK_GMAIL_APP_PASSWORD: ${{ secrets.MARK_GMAIL_APP_PASSWORD }}
          # Service-account key. Until this secret exists the build falls back
          # to the embedded copy, so nothing breaks in the meantime.
          MARK_SA_PRIVATE_KEY: ${{ secrets.MARK_SA_PRIVATE_KEY }}
          VITE_GH_SYNC_TOKEN: ${{ secrets.VITE_GH_SYNC_TOKEN }}
          # Updater signing. When absent the build succeeds but the updater
          # plugin cannot verify downloads. Add these secrets before shipping
          # the updater feature to users.
          # Generate with: npx tauri signer generate -w ~/.tauri/mark-app.key
          # Then put the PRIVATE KEY string in TAURI_SIGNING_PRIVATE_KEY
          # and the PASSWORD in TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
          # The PUBLIC KEY goes ONLY in tauri.conf.json plugins.updater.pubkey
          # (already committed — never put the private key there).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'MARK v__VERSION__'
          releaseBody: |
            Download the .msi or .exe installer below.
            Requirements: Windows 10+
          # Publish only when building main; any other ref (e.g. a dispatched
          # feature branch) produces a DRAFT installer to test — drafts are
          # excluded from /releases/latest, so the in-app updater won't serve it.
          releaseDraft: ${{ github.ref != 'refs/heads/main' }}
          prerelease: false
          tauriScript: npx tauri
          args: --target x86_64-pc-windows-msvc
          # Generate latest.json + .sig files for the updater plugin.
          # Requires TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # secrets to be set. If they are absent, tauri-action silently skips this.
          createUpdaterArtifacts: v2Compatible

      # Upload latest.json to a PUBLIC Gist so the updater plugin can fetch it
      # without authentication. The repo is private so /releases/latest/download/latest.json
      # is inaccessible to the plugin. The Gist contains only public data:
      # version number, installer download URLs, and cryptographic signatures.
      # No secrets are exposed. GIST_TOKEN needs 'gist' scope only.
      # Set MARK_UPDATER_GIST_ID in repo secrets to the ID of the public gist.
      - name: Publish latest.json to public Gist
        if: github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.MARK_UPDATER_GIST_ID }}
        run: |
          $jsonPath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/latest.json"
          if (-not (Test-Path $jsonPath)) {
            Write-Host "latest.json not found at $jsonPath — skipping Gist upload (signing keys may not be set)"
            exit 0
          }
          if (-not $env:GIST_TOKEN -or -not $env:GIST_ID) {
            Write-Host "GIST_TOKEN or MARK_UPDATER_GIST_ID not set — skipping Gist upload"
            exit 0
          }
          $content = Get-Content $jsonPath -Raw
          Write-Host "Uploading latest.json to Gist $env:GIST_ID"
          $body = @{ files = @{ "latest.json" = @{ content = $content } } } | ConvertTo-Json -Depth 5
          $headers = @{ Authorization = "token $env:GIST_TOKEN"; "Content-Type" = "application/json" }
          $resp = Invoke-RestMethod -Method Patch `
            -Uri "https://api.github.com/gists/$env:GIST_ID" `
            -Headers $headers -Body $body
          Write-Host "Gist updated: $($resp.html_url)"
